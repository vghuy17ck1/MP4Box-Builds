name: Scheduled builds

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Publish even when a matching release already exists
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      target: all
      variant: all
      source_channel: all
      force_rebuild: ${{ inputs.force_rebuild || false }}
